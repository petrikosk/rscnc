[package]
name = "rscnc"
version = "0.1.0"
authors = ["Petri Koskinen"]
edition = "2021"
description = "CNC motion control layer (DIN 66025 G-code decoder, path preprocessing, jerk-limited look-ahead interpolator) on top of the rsruckig trajectory generator"
license = "MIT"

[dependencies]
rsruckig = { path = "../../rsruckig/lib" }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
proptest = "1"
