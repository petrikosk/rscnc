[package]
name = "rscnc"
version = "0.1.0"
authors = ["Petri Koskinen"]
edition = "2021"
description = "CNC motion control layer (DIN 66025 G-code decoder, path preprocessing, jerk-limited look-ahead interpolator) on top of the rsruckig trajectory generator"
license = "MIT"
repository = "https://github.com/petrikosk/rscnc"
readme = "../README.md"
keywords = ["cnc", "gcode", "motion", "trajectory", "interpolation"]
categories = ["science::robotics", "algorithms"]

[features]
default = ["std"]
# Standard library support (float math via std intrinsics).
std = ["rsruckig/std", "num-traits/std"]
# Float math via `libm` for `no_std` builds. Either `std` or `libm` must be
# enabled. `no_std` builds still require a global allocator (`alloc`).
libm = ["rsruckig/libm", "rsruckig/alloc", "num-traits/libm"]

[dependencies]
rsruckig = { version = "3", default-features = false }
thiserror = { version = "2", default-features = false }
num-traits = { version = "0.2.19", default-features = false }

[dev-dependencies]
proptest = "1"
