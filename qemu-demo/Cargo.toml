[package]
name = "rscnc-qemu-demo"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bare-metal no_std smoke test: runs the rscnc pipeline on an emulated Cortex-M3 (QEMU mps2-an385)"

[dependencies]
rscnc = { path = "../lib", default-features = false, features = ["libm"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = { version = "0.6", features = ["exit"] }
embedded-alloc = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
